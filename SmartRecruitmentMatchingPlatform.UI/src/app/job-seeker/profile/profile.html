<div class="max-w-5xl mx-auto space-y-8">

  <div>

    <h1 class="page-title">
      My Profile
    </h1>

    <p class="page-description">
      Keep your professional profile up to date.
    </p>

  </div>

  <form class="space-y-8">

    <div class="card">

      <div class="card-header">

        <h2 class="text-xl font-semibold">
          Personal Information
        </h2>

      </div>

      <div class="card-body grid gap-6 md:grid-cols-2">

        <div>

          <label class="mb-2 block font-medium">
            First Name
          </label>

          <input
            class="input"
            type="text"
            formControlName="firstName">

        </div>

        <div>

          <label class="mb-2 block font-medium">
            Last Name
          </label>

          <input
            class="input"
            type="text"
            formControlName="lastName">

        </div>

        <div>

          <label class="mb-2 block font-medium">
            Email
          </label>

          <input
            class="input"
            type="email"
            formControlName="email">

        </div>

        <div>

          <label class="mb-2 block font-medium">
            Phone Number
          </label>

          <input
            class="input"
            type="text"
            formControlName="phoneNumber">

        </div>

        <div class="md:col-span-2">

          <label class="mb-2 block font-medium">
            Professional Summary
          </label>

          <textarea
            rows="6"
            class="input"
            formControlName="professionalSummary">
          </textarea>

        </div>

      </div>

    </div>

    <div class="card">

      <div class="card-header">

        <h2 class="text-xl font-semibold">
          Resume
        </h2>

      </div>

      <div class="card-body">

        <input
          type="file"
          class="input">

      </div>

    </div>

    <div class="flex justify-end gap-4">

      <button
        type="button"
        class="btn-secondary">

        Cancel

      </button>

      <button
        type="submit"
        class="btn-primary">

        Save Profile

      </button>

    </div>

  </form>

</div>
