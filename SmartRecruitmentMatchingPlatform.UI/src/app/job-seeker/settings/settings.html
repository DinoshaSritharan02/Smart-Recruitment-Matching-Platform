@if (loading) {

<div class="flex min-h-screen items-center justify-center">

  <div class="text-center">

    <div
      class="mx-auto mb-4 h-12 w-12 animate-spin rounded-full border-4 border-blue-600 border-t-transparent">
    </div>

    <p class="text-lg text-gray-500">
      Loading profile...
    </p>

  </div>

</div>

} @else {

<div class="min-h-screen bg-slate-100 py-10">

  <div class="mx-auto max-w-4xl rounded-2xl bg-white p-8 shadow">

    <h1 class="mb-8 text-3xl font-bold">
      Edit Profile
    </h1>

    <form
      [formGroup]="form"
      (ngSubmit)="save()"
      class="space-y-6">

      <div class="grid gap-6 md:grid-cols-2">

        <div>

          <label class="mb-2 block font-medium">
            Phone Number
          </label>

          <input
            type="text"
            formControlName="phoneNumber"
            class="w-full rounded-lg border p-3 focus:border-blue-500 focus:outline-none">

        </div>

        <div>

          <label class="mb-2 block font-medium">
            Date of Birth
          </label>

          <input
            type="date"
            formControlName="dateOfBirth"
            class="w-full rounded-lg border p-3 focus:border-blue-500 focus:outline-none">

        </div>

        <div>

          <label class="mb-2 block font-medium">
            Gender
          </label>

          <select
            formControlName="gender"
            class="w-full rounded-lg border p-3 focus:border-blue-500 focus:outline-none">

            <option value="">Select Gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>

          </select>

        </div>

        <div>

          <label class="mb-2 block font-medium">
            Country
          </label>

          <input
            type="text"
            formControlName="country"
            class="w-full rounded-lg border p-3 focus:border-blue-500 focus:outline-none">

        </div>

      </div>

      <div>

        <label class="mb-2 block font-medium">
          City
        </label>

        <input
          type="text"
          formControlName="city"
          class="w-full rounded-lg border p-3 focus:border-blue-500 focus:outline-none">

      </div>

      <div>

        <label class="mb-2 block font-medium">
          Address
        </label>

        <textarea
          rows="3"
          formControlName="address"
          class="w-full rounded-lg border p-3 focus:border-blue-500 focus:outline-none">
        </textarea>

      </div>

      <div>

        <label class="mb-2 block font-medium">
          Professional Summary
        </label>

        <textarea
          rows="6"
          formControlName="professionalSummary"
          class="w-full rounded-lg border p-3 focus:border-blue-500 focus:outline-none">
        </textarea>

      </div>

      <div class="flex justify-end gap-4">

        <a
          routerLink="/job-seeker/profile"
          class="rounded-lg bg-gray-200 px-6 py-3 hover:bg-gray-300">

          Cancel

        </a>

        <button
          type="submit"
          class="rounded-lg bg-blue-600 px-8 py-3 text-white hover:bg-blue-700">

          Save Changes

        </button>

      </div>

    </form>

  </div>

</div>

}
