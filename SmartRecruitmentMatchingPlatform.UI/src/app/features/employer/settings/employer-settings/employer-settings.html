<div class="max-w-5xl mx-auto space-y-8">

  <div>

    <h1 class="page-title">
      Settings
    </h1>

    <p class="page-description">
      Manage your account preferences.
    </p>

  </div>

  <div class="card">

    <div class="card-header">

      <h2 class="text-xl font-semibold">
        Account Settings
      </h2>

    </div>

    <div class="card-body space-y-6">

      <div>

        <label class="mb-2 block font-medium">
          Full Name
        </label>

        <input
          type="text"
          class="input">

      </div>

      <div>

        <label class="mb-2 block font-medium">
          Email Address
        </label>

        <input
          type="email"
          class="input">

      </div>

      <div>

        <label class="mb-2 block font-medium">
          New Password
        </label>

        <input
          type="password"
          class="input">

      </div>

      <div>

        <label class="mb-2 block font-medium">
          Confirm Password
        </label>

        <input
          type="password"
          class="input">

      </div>

      <div class="flex justify-end gap-4">

        <button class="btn-secondary">

          Cancel

        </button>

        <button class="btn-primary">

          Save Changes

        </button>

      </div>

    </div>

  </div>

</div>
