<div class="max-w-5xl mx-auto p-6">

  <div class="mb-8">
    <h1 class="text-3xl font-bold text-gray-900">
      Edit Vacancy
    </h1>

    <p class="mt-2 text-gray-500">
      Update vacancy information.
    </p>
  </div>

  <form
    [formGroup]="form"
    (ngSubmit)="updateVacancy()"
    class="space-y-6 rounded-xl bg-white p-8 shadow-lg">

    <div>
      <label class="mb-2 block font-medium">
        Job Title
      </label>

      <input
        type="text"
        formControlName="jobTitle"
        class="w-full rounded-lg border px-4 py-3">
    </div>

    <div>
      <label class="mb-2 block font-medium">
        Job Description
      </label>

      <textarea
        rows="6"
        formControlName="jobDescription"
        class="w-full rounded-lg border px-4 py-3">
      </textarea>
    </div>

    <div class="grid gap-6 md:grid-cols-2">

      <div>
        <label class="mb-2 block font-medium">
          Employment Type
        </label>

        <select
          formControlName="employmentType"
          class="w-full rounded-lg border px-4 py-3">

          <option value="">Select</option>
          <option>Full Time</option>
          <option>Part Time</option>
          <option>Contract</option>

        </select>
      </div>

      <div>
        <label class="mb-2 block font-medium">
          Experience Level
        </label>

        <select
          formControlName="experienceLevel"
          class="w-full rounded-lg border px-4 py-3">

          <option value="">Select</option>
          <option>Entry Level</option>
          <option>Mid Level</option>
          <option>Senior Level</option>

        </select>
      </div>

    </div>

    <div class="grid gap-6 md:grid-cols-2">

      <div>
        <label class="mb-2 block font-medium">
          Location
        </label>

        <input
          type="text"
          formControlName="location"
          class="w-full rounded-lg border px-4 py-3">
      </div>

      <div>
        <label class="mb-2 block font-medium">
          Application Deadline
        </label>

        <input
          type="date"
          formControlName="applicationDeadline"
          class="w-full rounded-lg border px-4 py-3">
      </div>

    </div>

    <div class="grid gap-6 md:grid-cols-2">

      <div>
        <label class="mb-2 block font-medium">
          Minimum Salary
        </label>

        <input
          type="number"
          formControlName="salaryMin"
          class="w-full rounded-lg border px-4 py-3">
      </div>

      <div>
        <label class="mb-2 block font-medium">
          Maximum Salary
        </label>

        <input
          type="number"
          formControlName="salaryMax"
          class="w-full rounded-lg border px-4 py-3">
      </div>

    </div>

    <div class="flex justify-end gap-4">

      <button
        type="button"
        (click)="cancel()"
        class="rounded-lg border px-6 py-3">
        Cancel
      </button>

      <button
        type="submit"
        class="rounded-lg bg-blue-600 px-6 py-3 text-white hover:bg-blue-700">
        Save Changes
      </button>

    </div>

  </form>

</div>
