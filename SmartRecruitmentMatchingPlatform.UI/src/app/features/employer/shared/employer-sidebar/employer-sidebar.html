<div class="fixed inset-y-0 left-0 z-50 flex w-72 flex-col bg-[#143D2A] text-white shadow-2xl">

  <!-- Logo -->
<div class="border-b border-emerald-800 px-6 py-6 flex-shrink-0">

  <h2 class="text-2xl font-bold tracking-wide">
    Smart Recruit
  </h2>

  <p class="mt-1 text-sm text-emerald-200">
    Employer Portal
  </p>

</div>

  <!-- Menu -->
  <nav class="flex-1 overflow-y-auto px-4 py-6 space-y-2">

    @for(item of navigationItems; track item.route) {

      <a
        [routerLink]="item.route"
        routerLinkActive="sidebar-link-active"
        class="sidebar-link">

        <span class="text-lg">{{ item.icon }}</span>
        <span>{{ item.label }}</span>

      </a>

    }

  </nav>

  <!-- User Section -->
  <div class="border-t border-emerald-800 p-5 flex-shrink-0">

    

</div>
