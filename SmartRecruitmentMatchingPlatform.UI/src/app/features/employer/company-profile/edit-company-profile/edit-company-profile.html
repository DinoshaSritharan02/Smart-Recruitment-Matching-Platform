<div class="max-w-5xl mx-auto p-6">

  <div class="flex items-center justify-between mb-8">
    <div>
      <h1 class="text-3xl font-bold text-gray-900">
        Edit Company Profile
      </h1>

      <p class="mt-2 text-gray-500">
        Update your company information.
      </p>
    </div>

    <a
      routerLink="/employer/company-profile"
      class="rounded-lg border border-gray-300 px-5 py-2 hover:bg-gray-100 transition">
      Back
    </a>
  </div>

  <form
    [formGroup]="form"
    (ngSubmit)="updateProfile()"
    class="rounded-2xl border border-slate-200 bg-white shadow-sm-md p-8 space-y-6">

    <!-- Company Name -->
    <div>
      <label
        for="companyName"
        class="block text-sm font-medium text-gray-700 mb-2">
        Company Name
      </label>

      <input
        id="companyName"
        type="text"
        formControlName="companyName"
        placeholder="ABC Technologies"
        class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:border-emerald-600 focus:outline-none">

      @if(form.controls.companyName.invalid &&
      form.controls.companyName.touched){

      <p class="mt-2 text-sm text-red-600">
        Company name is required.
      </p>

      }
    </div>

    <!-- Description -->
    <div>
      <label
        for="companyDescription"
        class="block text-sm font-medium text-gray-700 mb-2">
        Company Description
      </label>

      <textarea
        id="companyDescription"
        rows="5"
        formControlName="companyDescription"
        placeholder="Describe your company..."
        class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:border-emerald-600 focus:outline-none">
      </textarea>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

      <!-- Industry -->
      <div>
        <label
          for="industry"
          class="block text-sm font-medium text-gray-700 mb-2">
          Industry
        </label>

        <input
          id="industry"
          type="text"
          formControlName="industry"
          placeholder="Software"
          class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:border-emerald-600 focus:outline-none">
      </div>

      <!-- Location -->
      <div>
        <label
          for="companyLocation"
          class="block text-sm font-medium text-gray-700 mb-2">
          Company Location
        </label>

        <input
          id="companyLocation"
          type="text"
          formControlName="companyLocation"
          placeholder="Colombo"
          class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:border-emerald-600 focus:outline-none">
      </div>

    </div>

    <!-- Website -->
    <div>
      <label
        for="website"
        class="block text-sm font-medium text-gray-700 mb-2">
        Website
      </label>

      <input
        id="website"
        type="url"
        formControlName="website"
        placeholder="https://company.com"
        class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:border-emerald-600 focus:outline-none">
    </div>

    <!-- Buttons -->
    <div class="flex justify-end gap-4 pt-6">

      <button
        type="button"
        (click)="cancel()"
        class="rounded-lg border border-gray-300 px-6 py-3 hover:bg-gray-100 transition">
        Cancel
      </button>

      <button
        type="submit"
        class="rounded-lg btn-primary px-6 py-3 text-white hover:bg-emerald-700 transition">
        Save Changes
      </button>

    </div>

  </form>

</div>
